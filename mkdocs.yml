site_name: iCal4j
site_url: https://www.ical4j.org
theme:
  name: material
  favicon: images/favicon.png
  logo: images/logo-48.png
  features:
    - content.code.copy
    - navigation.tabs
    
repo_url: https://github.com/ical4j/ical4j-user-guide
repo_name: ical4j/ical4j-user-guide
strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: relative_to_docs
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
plugins:
  - search
  - redirects:
      redirect_maps:
        command/calendar.md: command/reference.md#calendar
        command/card.md: command/reference.md#card
        command/channel.md: command/reference.md#channel
